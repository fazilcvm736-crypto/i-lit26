.opts{display:flex;flex-wrap:wrap;gap:8px}

.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}

.tg{background:var(--bg);color:var(--mute);border-radius:99px;padding:1px 10px;font:600 11px 'Poppins',sans-serif}.tg.ok{background:rgba(5,150,105,.14);color:var(--ok)}
.pb{display:flex;gap:8px;flex-wrap:wrap}

label{display:block;font-weight:500;margin-top:10px}

.x{all:unset;cursor:pointer;color:var(--mute)}

.side{display:none}
@media (min-width:960px){.side{display:flex;flex-direction:column;gap:2px;position:fixed;left:0;top:0;bottom:0;width:230px;background:#0b1f17;padding:18px 12px;overflow-y:auto;z-index:5}body{padding-left:230px}.side .sb{display:flex;align-items:center;gap:10px;color:#fff;font:700 16px 'Poppins',sans-serif;padding:4px 8px 14px}.side .sb img{width:34px;height:34px;border-radius:9px;background:#fff;padding:2px;object-fit:contain}.sg{color:#6f8f80;font:600 11px 'Poppins',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:14px 10px 6px}.si{all:unset;cursor:pointer;color:#cfe4da;padding:9px 12px;border-radius:10px;font:500 14px 'Poppins',sans-serif}.si:hover{background:rgba(255,255,255,.07)}.si[aria-pressed=true]{background:rgba(52,211,153,.16);color:#34d399}.si:focus-visible{outline:3px solid #34d399}}

</style>

<div class="auth" id="auth" role="dialog" aria-modal="true" aria-labelledby="au-title">

<button class="au-link" id="au-fp" type="button">Forgot password?</button>
</div></div>

<script>(function () {
/* Firebase via CDN script tags (compat SDK). Provides sign-in (Auth) and live shared data (Firestore). */
var showErr = function (t) { var m = document.getElementById("au-m"); if (m) m.textContent = t; };
if (typeof firebase === "undefined") {
  showErr("Could not load the Firebase scripts from gstatic.com. Open this page from your hosted web address (https) in Chrome, and turn off any ad blocker, VPN or data saver.");
  return;
}

var firebaseConfig = {
  apiKey: "AIzaSyD5VF4WHYqjIRiUiwRM9zZwOJKmU1ihxkw",
  authDomain: "i-lit-fest-26.firebaseapp.com",
  projectId: "i-lit-fest-26",
  storageBucket: "i-lit-fest-26.firebasestorage.app",
  messagingSenderId: "484032743879",
  appId: "1:484032743879:web:fad3d0524c2fc616b9b1e2",
  measurementId: "G-9CHGPYDNS9"
};

var app = firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
var TS = function () { return firebase.firestore.FieldValue.serverTimestamp(); };
window.fbApp = app;
try { if (firebase.analytics) window.fbAnalytics = firebase.analytics(); } catch (e) {}
window.fbReady = true;

const g = function (id) { return document.getElementById(id); };
let mode = "login", busy = false, pending = null, unsub = null;

const ERR = {
  "auth/invalid-email": "Enter a valid email address.",
  "auth/missing-password": "Enter your password.",
  "auth/invalid-credential": "Email or password is incorrect.",
  "auth/wrong-password": "Email or password is incorrect.",
  "auth/user-not-found": "Email or password is incorrect.",
  "auth/email-already-in-use": "An account with this email already exists. Try logging in.",
  "auth/weak-password": "Choose a password with at least 6 characters.",
  "auth/too-many-requests": "Too many attempts. Please wait a little and try again.",
  "auth/network-request-failed": "No internet connection. Please try again.",
  "auth/operation-not-allowed": "Email and password sign-in is not turned on in Firebase yet."
};
function nice(e) { const c = (e && e.code) || ""; return ERR[c] || ("Something went wrong (" + (c || "unknown") + "). Please try again."); }
function msg(t, ok) { const m = g("au-m"); m.textContent = t; m.className = ok ? "ok" : ""; }

function setMode(m) {
  mode = m;
  g("au-t1").setAttribute("aria-pressed", String(m === "login"));
  g("au-t2").setAttribute("aria-pressed", String(m === "signup"));
  g("au-title").textContent = m === "login" ? "Log in" : "Create your account";
  g("au-nl").classList.toggle("h", m === "login");
  g("au-n").classList.toggle("h", m === "login");
  g("au-fp").classList.toggle("h", m !== "login");
  g("au-go").textContent = m === "login" ? "Log in" : "Sign up";
  g("au-p").autocomplete = m === "login" ? "current-password" : "new-password";
  msg("");
}

async function submit() {
  if (busy) return;
  const email = g("au-e").value.trim(), pw = g("au-p").value, name = g("au-n").value.trim();
  if (mode === "signup" && !name) { msg("Enter your name."); g("au-n").focus(); return; }
  if (!email) { msg("Enter your email."); g("au-e").focus(); return; }
  if (!pw) { msg("Enter your password."); g("au-p").focus(); return; }
  if (mode === "signup" && pw.length < 6) { msg("Choose a password with at least 6 characters."); g("au-p").focus(); return; }
  busy = true; g("au-go").disabled = true;
  msg(mode === "login" ? "Logging in…" : "Creating your account…", true);
  try {
    if (mode === "login") {
      await auth.signInWithEmailAndPassword(email, pw);
    } else {
      pending = (async function () {
        const c = await auth.createUserWithEmailAndPassword(email, pw);
        try { await c.user.updateProfile({ displayName: name }); } catch (e) {}
        try { await db.collection("users").doc(c.user.uid).set({ email: email, name: name, role: "leader", createdAt: TS() }); } catch (e) {}
      })();
      await pending;
    }
  } catch (e) { msg(nice(e)); }
  pending = null; busy = false; g("au-go").disabled = false;
}

async function forgot() {
  const email = g("au-e").value.trim();
  if (!email) { msg("Enter your email above first."); g("au-e").focus(); return; }
  try { await auth.sendPasswordResetEmail(email); msg("If an account exists for this email, a reset link has been sent.", true); }
  catch (e) { msg(nice(e)); }
}

g("au-t1").onclick = function () { setMode("login"); };
g("au-t2").onclick = function () { setMode("signup"); };
g("au-go").onclick = submit;
g("au-fp").onclick = forgot;
["au-n", "au-e", "au-p"].forEach(function (id) { g(id).addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); }); });
window.fbLogout = function () { auth.signOut(); };
if (window.S && window.S.logo) { g("au-lg").src = window.S.logo; g("au-lg").classList.remove("h"); }

function gate(on) {
  document.body.classList.toggle("authed", !on);
  ["#side", ".wrap", "#mb"].forEach(function (q) { const e = document.querySelector(q); if (e) e.inert = on; });
}

async function loadRole(u) {
  const ref = db.collection("users").doc(u.uid);
  try {
    const s = await ref.get();
    if (s.exists) return { role: s.data().role === "admin" ? "admin" : "leader" };
    await ref.set({ email: u.email, name: u.displayName || "", role: "leader", createdAt: TS() });
    return { role: "leader" };
  } catch (e) { return { role: "leader", err: true }; }
}

function stopSync() {
  if (unsub) { unsub(); unsub = null; }
  window.DBD = null; window.ED = false; window.RO = true;
}

function startSync(canEdit) {
  stopSync();
  window.ED = canEdit; window.RO = !canEdit;
  const ref = db.collection("fest").doc("state");
  window.DBD = { set: function (o) { return ref.set(o); } };
  const nt = g("nt");
  if (nt) nt.textContent = canEdit ? "Live: every change is saved, and everyone who is logged in sees it." : "View only: results update live.";
  const d = g("dlg");
  if (!d.dataset.fb) {
    d.dataset.fb = "1";
    d.addEventListener("close", function () { if (window.PEND) { const j = window.PEND; window.PEND = null; window.applyRemote(j); } });
  }
  unsub = ref.onSnapshot(function (s) {
    if (s.exists) {
      const x = s.data() || {};
      if (x.json && x.json !== window.LASTJ) { if (d.open) window.PEND = x.json; else window.applyRemote(x.json); }
    } else if (canEdit) { window.LASTJ = ""; window.push(); }
  }, function () { if (nt) nt.textContent = "Could not reach the live database. Showing the last saved data."; });
  window.render();
}

auth.onAuthStateChanged(async function (u) {
  if (!u) {
    stopSync(); window.fbUser = null; gate(true);
    g("au-go").disabled = false; msg("");
    if (window.render) window.render();
    return;
  }
  if (pending) { try { await pending; } catch (e) {} }
  const r = await loadRole(u);
  if (!auth.currentUser || auth.currentUser.uid !== u.uid) return;
  window.fbUser = { uid: u.uid, email: u.email || "", name: u.displayName || u.email || "", role: r.role, err: !!r.err };
  g("au-p").value = "";
  gate(false);
  startSync(r.role === "admin");
});
})();
</script>
